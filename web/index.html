  </div>
  <div class="tb-title">
    <h1 id="d-title">—</h1>
    <p id="d-meta"></p>
  </div>
  <div class="tb-end">
    <button class="search-pill" id="open-palette" aria-label="Search drawings and commands"><span data-icon="search"></span><span class="sp-text">Search</span><kbd>⌘K</kbd></button>
    <button class="tb-upload" id="btn-upload" title="Upload a floor plan image"><span data-icon="upload"></span><span class="tbu-t">Upload</span></button>
    <div class="set-wrap">
      <button class="icon-btn" id="btn-settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings" title="Settings" data-icon="gear"></button>
      <div class="settings" id="settings" role="menu" hidden>
        <label class="set-row" role="menuitemcheckbox"><span><b>Example drawings</b><small>Show the library of example plans</small></span><span class="switch"><input type="checkbox" id="set-examples"><span aria-hidden="true"></span></span></label>
        <div class="set-sep"></div>
        <button class="set-item" id="open-bench" role="menuitem"><span data-icon="chart"></span><span><b>Test report</b><small>Accuracy on Stoa's questions</small></span></button>
        <div class="set-sep"></div>
        <p class="set-head">Keyboard</p>
        <dl class="set-keys"><div><dt>Search</dt><dd><kbd>⌘K</kbd></dd></div><div><dt>Example drawings</dt><dd><kbd>⌘B</kbd></dd></div><div><dt>Ask</dt><dd><kbd>/</kbd></dd></div><div><dt>Step through the marks</dt><dd><kbd>←</kbd><kbd>→</kbd></dd></div><div><dt>Details</dt><dd><kbd>⌘I</kbd></dd></div></dl>
      </div>
    </div>
  </div>
</header>

<main class="desk">
  <nav class="reg" aria-label="Library">
    <div class="reg-head"><span>Library</span><button class="icon-btn" id="lib-close" aria-label="Close the examples and go back to upload" title="Close" data-icon="x"></button></div>
    <div class="rows" id="list-wrap">
      <details class="grp" id="grp-ex"><summary><span data-icon="chev-r"></span>Examples</summary><div id="demo"></div></details>
      <details class="grp" id="grp-all"><summary><span data-icon="chev-r"></span>All drawings <span id="reg-count"></span></summary>
        <div class="reg-tools">
          <label class="find"><span class="sr">Find a drawing</span><span data-icon="search"></span>
            <input id="search" type="search" placeholder="Find a drawing" autocomplete="off" spellcheck="false"></label>
          <div class="filters">
            <select id="sources" class="popup" aria-label="Source"></select>
            <label class="switch" title="Only drawings that come with Stoa's questions"><input type="checkbox" id="only-q" checked><span aria-hidden="true"></span>Has questions</label>
          </div>
        </div>
        <div id="list"></div>
      </details>
    </div>
  </nav>

  <section class="board" id="board" aria-label="Drawing">
    <div class="stage" id="stage">
      <div class="canvas" id="canvas"></div>
      <iframe id="three" class="hidden" title="3D model"></iframe>
      <div class="stage-msg" id="stage-msg" aria-live="polite"></div>
      <div class="start" id="start" hidden>
        <button class="start-btn" id="start-choose" title="PNG, JPEG, WebP, TIFF or BMP — or drop the image anywhere here"><span data-icon="upload"></span>Upload</button>
        <p class="start-sub">Upload a sheet or use <button class="link" id="start-examples">Examples</button></p>
        <small id="up-msg" aria-live="polite"></small>
      </div>
      <div class="hud zoom" role="group" aria-label="Zoom">
        <button id="z-in" aria-label="Zoom in" title="Zoom in" data-icon="plus"></button>
        <output id="z-val">100%</output>
        <button id="z-out" aria-label="Zoom out" title="Zoom out" data-icon="minus"></button>
        <button id="z-fit" aria-label="Fit the sheet" title="Fit" data-icon="fit"></button>
      </div>
    </div>

    <div class="vcap" id="vcap" role="toolbar" aria-label="View">
      <div class="seg" id="view-seg" role="group" aria-label="View">
        <button data-view="sheet" class="on" aria-pressed="true"><span data-icon="doc"></span>Sheet</button>
        <button data-view="3d" id="btn-3d" aria-pressed="false"><span data-icon="cube"></span>3D</button>
      </div>
      <select id="sheet-select" class="popup hidden" aria-label="Sheet of this drawing"></select>
      <span class="vsep" aria-hidden="true"></span>
      <button class="icon-btn" id="btn-graph" aria-pressed="false" aria-label="Room graph" title="Room graph — how the rooms connect" data-icon="graph"></button>
      <button class="icon-btn" id="btn-heat" aria-pressed="false" aria-label="Confidence colours" title="Confidence — colour each mark by how it was found" data-icon="shield"></button>
      <button class="icon-btn" id="btn-split" aria-pressed="false" aria-label="Split view" title="Split view — another sheet or the legend beside this one" data-icon="split"></button>
    </div>

    <p class="credit" id="credit-wrap" tabindex="0"><span data-icon="info"></span><span id="credit"></span></p>

    <div class="dock" id="dock">
      <article class="card hidden" id="card" aria-live="polite"></article>
      <div class="hist" id="hist" role="menu" aria-label="Earlier answers" hidden></div>
      <form class="ask" id="ask">
        <label class="sr" for="q">Ask about this drawing</label>
        <button type="button" class="icon-btn" id="btn-hist" aria-label="Earlier answers" title="Earlier answers" aria-haspopup="true" aria-expanded="false" aria-controls="hist" data-icon="history"><b id="hist-n"></b></button>
        <textarea id="q" rows="1" placeholder="Ask about this drawing, in any language"></textarea>
        <button type="button" class="icon-btn mic" id="mic" aria-label="Ask by voice" title="Ask by voice" data-icon="mic"></button>
        <button class="send" id="send" aria-label="Ask" data-icon="send"></button>
      </form>
    </div>
  </section>

  <aside class="insp" id="inspector" aria-label="Answer details">
    <header class="insp-head"><h2>Details</h2><button class="icon-btn" id="insp-close" aria-label="Close the details" title="Close (⌘I)" data-icon="x"></button></header>
    <div class="insp-body" id="insp-body"></div>
  </aside>
</main>

<dialog class="palette" id="palette" aria-label="Search drawings and commands">
  <div class="pal-in"><span data-icon="search"></span><input id="pal-q" placeholder="Search drawings, ask, or run a command" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
  <div class="pal-list" id="pal-list" role="listbox"></div>
  <p class="pal-foot"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>↵</kbd> open <kbd>esc</kbd> close</p>
</dialog>

<dialog class="report" id="bench" aria-labelledby="bench-title">
  <header><div><span class="lbl">Test report</span><h2 id="bench-title">Measured on Stoa's questions</h2></div><button class="icon-btn" id="close-bench" aria-label="Close" data-icon="x"></button></header>
  <div id="bench-body"></div>
</dialog>
<input type="file" id="up-file" class="sr" tabindex="-1" aria-hidden="true" accept="image/png,image/jpeg,image/webp,image/tiff,image/bmp">
<div id="tip" class="tip hidden" role="tooltip"></div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
